server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relative Weiterleitungen, damit es hinter Cloudflare/Reverse-Proxy
    # nicht auf http://…:8080 umleitet.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    # Saubere URLs
    location = /about   { include /etc/nginx/snippets/html.conf; try_files /about.html =404; }
    location = /imprint { include /etc/nginx/snippets/html.conf; try_files /imprint.html =404; }

    # Alte .html-Adressen auf die sauberen URLs umleiten
    location = /about.html   { return 301 /about; }
    location = /imprint.html { return 301 /imprint; }

    location = / {
        include /etc/nginx/snippets/html.conf;
        try_files /index.html =404;
    }

    # Laufzeit: kurz cachen, damit neue Deployments schnell ankommen
    location = /support.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Bilder, Icons
    location ~* \.(svg|png|jpg|jpeg|webp|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/snippets/html.conf;
        try_files $uri =404;
    }

    error_page 404 /index.html;
}
