name: Build & push Docker image

on:
  push:
    branches: [main]
    # Der Pipeline-Commit, der nur die Stack-Datei ändert, löst keinen neuen Build aus
    paths-ignore:
      - 'deploy/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # für den Commit mit dem neuen Image-Tag in deploy/
  packages: write   # für den Push nach ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker run -d --name smoke -p 8080:8080 "$IMAGE"
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          for path in / /about /imprint /support.js /favicon.svg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { docker logs smoke; exit 1; }
          done
          docker rm -f smoke

      - name: Pin new image in Portainer stack
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          sed -i -E "s#^([[:space:]]*image:[[:space:]]*).*#\1${IMAGE}#" deploy/portainer-stack.yml
          grep -n "image:" deploy/portainer-stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/portainer-stack.yml
          if git diff --cached --quiet; then echo "Stack already up to date."; exit 0; fi
          git commit -m "deploy: ${IMAGE##*:} [skip ci]"
          git push

      - name: Trigger Portainer redeploy (optional)
        if: github.event_name != 'pull_request'
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "Secret PORTAINER_WEBHOOK_URL is not set – skipping redeploy."
            exit 0
          fi
          curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"
          echo "Portainer redeploy triggered."
