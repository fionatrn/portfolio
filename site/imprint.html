<div style="display: flex; flex-direction: column; gap: 4px"><h3 style="{{label}}; margin: 0">Verantwortliche</h3><p style="{{body}}">Fiona Tran – Anschrift und Kontakt siehe Impressum.</p></div>
<div style="display: flex; flex-direction: column; gap: 4px"><h3 style="{{label}}; margin: 0">Hosting und Server-Logfiles</h3><p style="{{body}}">Diese Website wird von Ende Solutions (Linus Ende), Kattowitzer Straße 9, 38440 Wolfsburg, gehostet. Mit dem Hoster besteht ein Vertrag zur Auftragsverarbeitung nach Art. 28 DSGVO. Der eingehende Datenverkehr wird über einen Server der Hetzner Online GmbH, Industriestraße 25, 91710 Gunzenhausen, weitergeleitet. Beim Aufruf der Seite werden automatisch Ihre IP-Adresse sowie Datum und Uhrzeit des Zugriffs verarbeitet, um die Seite auszuliefern und den sicheren Betrieb zu gewährleisten. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO. Die Logfiles werden nach 6 Monaten automatisch gelöscht.</p></div>
<div style="display: flex; flex-direction: column; gap: 4px"><h3 style="{{label}}; margin: 0">Cloudflare</h3><p style="{{body}}">Zur Auslieferung der Seite und zum Schutz vor Angriffen wird Cloudflare (Cloudflare, Inc., USA) eingesetzt. Dabei werden Verbindungsdaten wie Ihre IP-Adresse verarbeitet, auch in den USA. Cloudflare ist unter dem EU-US Data Privacy Framework zertifiziert (Angemessenheitsbeschluss der EU-Kommission vom 10. Juli 2023). Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO.</p></div>
<div style="display: flex; flex-direction: column; gap: 4px"><h3 style="{{label}}; margin: 0">Schriftarten (Google Fonts)</h3><p style="{{body}}">Diese Website lädt Schriftarten von Google Fonts, einem Dienst der Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland. Dabei wird Ihre IP-Adresse an Google übermittelt; eine Übermittlung in die USA ist möglich. Google ist unter dem EU-US Data Privacy Framework zertifiziert. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (einheitliche Darstellung der Website). Weitere Informationen: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener" style="{{linkInline}}">policies.google.com/privacy</a></p></div>
<div style="display: flex; flex-direction: column; gap: 4px"><h3 style="{{label}}; margin: 0">Speicherung im Browser</h3><p style="{{body}}">Ihre Auswahl zwischen hellem und dunklem Design wird ausschließlich lokal in Ihrem Browser (Local Storage) gespeichert und nicht an mich übertragen. Das ist für diese Funktion unbedingt erforderlich (§ 25 Abs. 2 Nr. 2 TDDDG). Sie können den Eintrag jederzeit über die Einstellungen Ihres Browsers löschen.</p></div>
<div style="display: flex; flex-direction: column; gap: 4px"><h3 style="{{label}}; margin: 0">Kontakt per E-Mail</h3><p style="{{body}}">Wenn Sie mir eine E-Mail schreiben, verarbeite ich Ihre Angaben nur, um Ihre Anfrage zu beantworten (Art. 6 Abs. 1 lit. b bzw. lit. f DSGVO), und lösche sie, sobald sie dafür nicht mehr benötigt werden.</p></div>
<div style="display: flex; flex-direction: column; gap: 4px"><h3 style="{{label}}; margin: 0">Links zu anderen Plattformen</h3><p style="{{body}}">Die Verweise auf GitHub, LinkedIn, Pinterest und Instagram sind einfache Links. Daten werden erst übertragen, wenn Sie einen Link anklicken; ab dann gilt die Datenschutzerklärung der jeweiligen Plattform.</p></div>
<div style="display: flex; flex-direction: column; gap: 4px"><h3 style="{{label}}; margin: 0">Keine Cookies, kein Tracking</h3><p style="{{body}}">Diese Website setzt keine Cookies und nutzt keine Analyse- oder Tracking-Dienste.</p></div>
<div style="display: flex; flex-direction: column; gap: 4px"><h3 style="{{label}}; margin: 0">Ihre Rechte</h3><p style="{{body}}">Sie haben das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung und Datenübertragbarkeit sowie das Recht, Verarbeitungen auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO zu widersprechen. Wenden Sie sich dazu an hello@fiona-tran.com. Außerdem können Sie sich bei einer Datenschutz-Aufsichtsbehörde beschweren, zum Beispiel bei der Landesbeauftragten für den Datenschutz Niedersachsen.</p></div>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"mobile":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
componentDidMount() { this._checkStacked(); }
componentDidUpdate() { this._checkStacked(); }
// Prüft, ob die Datenschutz-Spalte unter das Impressum umbricht: zwei Spalten à 360 px + 64 px Abstand passen nicht nebeneinander.
// An der Breite gemessen, nicht an der Position – die Trennlinie erzwingt selbst einen Umbruch und würde die Messung verfälschen.
_checkStacked() {
try {
const a = document.getElementById('imp');
if (!a) return;
const st = a.closest('section').parentElement.clientWidth < 360 + 64 + 360;
if (st !== !!this.state.stacked) this.setState({ stacked: st });
} catch (e) {}
}
renderVals() {
const sysDark = (() => { try { const s = window.localStorage.getItem('fiona-theme'); if (s) return s === 'dark'; return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { return false; } })();
const dark = this.state.dark ?? (this.props.dark ? true : sysDark);
if (!this._rs && typeof window !== 'undefined') { try { this._rs = () => this.setState({ vw: window.innerWidth }); window.addEventListener('resize', this._rs); } catch (e) {} }
const vw = Number(this.props.vw) || (typeof window !== 'undefined' && window.innerWidth) || 1440;
const vh = Number(this.props.vh) || (typeof window !== 'undefined' && window.innerHeight) || 900;
const mob = !!this.props.mobile || vw < 760 || (!this.props.vw && vh < 500);
const cmp = !mob && vw < 1000;
const side = mob ? 20 : cmp ? 24 : 48;
const t = dark ? { bg: '#141416', ink: '#F2F2F4', muted: '#A4A7AF', glass: 'rgba(255,255,255,0.06)', border: 'rgba(255,255,255,0.12)', shadow: '0 12px 40px rgba(0,0,0,0.22)', glowA: 'rgba(0,0,0,0)', glowB: 'rgba(0,0,0,0)', grain: '0.16', blend: 'screen', line: 'rgba(255,255,255,0.14)' }
: { bg: '#E9E9EC', ink: '#0E0E10', muted: '#55585F', glass: 'rgba(255,255,255,0.55)', border: 'rgba(255,255,255,0.85)', shadow: '0 12px 40px rgba(20,20,40,0.08)', glowA: 'rgba(159,227,201,0.55)', glowB: 'rgba(242,167,195,0.45)', grain: '0.22', blend: 'multiply', line: 'rgba(14,14,16,0.14)' };
const glass = 'background: ' + (dark ? 'linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.04) 100%)' : 'linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.16) 100%)') + '; border: 0; box-shadow: inset 0 0.5px 0 rgba(255,255,255,' + (dark ? '0.14' : '0.55') + '), inset 0 0 14px rgba(255,255,255,' + (dark ? '0.04' : '0.2') + '), ' + t.shadow + '; backdrop-filter: blur(20px) saturate(190%); -webkit-backdrop-filter: blur(20px) saturate(190%)';
const pillBase = 'display: inline-flex; align-items: center; justify-content: center; flex: none; min-height: 44px; padding: 0 20px; border-radius: 999px; font: 500 15px/1 "M PLUS Rounded 1c", Inter, sans-serif; border: 0; cursor: pointer; ';
return {
t, desktop: !mob, mobile: mob, isDark: dark, isLight: !dark, logoH: mob ? 16 : 30,
darkLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
toggleDark: () => { try { window.localStorage.setItem('fiona-theme', dark ? 'light' : 'dark'); } catch (e) {} this.setState({ dark: !dark }); },
bgGrain: dark ? 'position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.08; mix-blend-mode: overlay; pointer-events: none' : 'display: none',
rootStyle: 'position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; overflow: clip; background: ' + (dark ? 'radial-gradient(75% 65% at 0% 0%, rgba(159,227,201,0.22) 0%, rgba(159,227,201,0.07) 45%, rgba(159,227,201,0) 75%), radial-gradient(75% 65% at 100% 100%, rgba(242,167,195,0.18) 0%, rgba(242,167,195,0.06) 45%, rgba(242,167,195,0) 75%), #141416' : t.bg) + '; color: ' + t.ink + '; font-family: Inter, sans-serif; display: flex; flex-direction: column; transition: background 0.4s',
glowA: 'position: absolute; width: 900px; height: 900px; left: -220px; top: -260px; border-radius: 50%; background: radial-gradient(circle, ' + t.glowA + ' 0%, rgba(0,0,0,0) 65%); pointer-events: none',
glowB: 'position: absolute; width: 1000px; height: 1000px; right: -260px; bottom: -380px; border-radius: 50%; background: radial-gradient(circle, ' + t.glowB + ' 0%, rgba(0,0,0,0) 65%); pointer-events: none',
grainStyle: 'position: absolute; inset: 0; width: 100%; height: 100%; opacity: ' + t.grain + '; mix-blend-mode: ' + t.blend + '; pointer-events: none',
headerStyle: 'position: relative; z-index: 20; display: grid; grid-template-columns: ' + (mob ? 'minmax(0, 1fr) auto' : 'minmax(0, 1fr) auto minmax(0, 1fr)') + '; align-items: center; gap: 16px; padding: ' + (mob ? '56px 20px 8px' : '28px ' + side + 'px'),
navStyle: 'display: flex; gap: 4px; padding: 4px; border-radius: 999px; ' + glass,
pill: pillBase + 'color: ' + t.ink,
pillActive: pillBase + 'background: ' + t.ink + '; color: ' + t.bg,
iconBtn: 'display: inline-flex; align-items: center; justify-content: center; justify-self: end; flex: none; width: 44px; height: 44px; padding: 0; border-radius: 999px; cursor: pointer; ' + glass,
mainStyle: 'position: relative; z-index: 10; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px ' + side + 'px ' + (mob ? '120px' : '24px'),
wrap: 'width: 100%; max-width: 1240px; box-sizing: border-box; flex: 1; display: flex; flex-direction: column; gap: 20px; padding: ' + (mob ? '16px 0 24px' : '40px clamp(0px, 2vw, 28px) 24px'),
kicker: 'font: 500 12px/1.4 Inter, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: ' + t.muted,
cols: 'display: flex; flex-wrap: wrap; gap: 32px 64px; border-top: 1px solid ' + t.line + '; padding-top: 28px',
col: 'flex: 1 1 360px; max-width: 560px; display: flex; flex-direction: column; gap: 14px',
// Stehen Impressum und Datenschutz untereinander (Handy, schmale Fenster), trennt eine Linie über die volle Breite – so lang wie die Linie über dem Impressum –, mit Luft darüber und darunter (32 px Zeilenabstand + 16 px)
divider: this.state.stacked ? 'flex: 0 0 100%; height: 0; border-top: 1px solid ' + t.line + '; margin: 16px 0' : 'display: none',
h1: 'margin: 0; scroll-margin-top: 32px; font: 700 28px/1.2 "M PLUS Rounded 1c", Inter, sans-serif; letter-spacing: -0.02em; color: ' + t.ink,
label: 'font: 600 15px/1.4 Inter, sans-serif; color: ' + t.muted,
small: 'margin: 0; font: 400 14px/1.5 Inter, sans-serif; color: ' + t.muted,
body: 'margin: 0; font: 400 16px/1.6 Inter, sans-serif; color: ' + t.ink,
linkInline: 'color: ' + t.ink + '; text-decoration: underline; text-underline-offset: 3px',
link: 'display: inline-flex; align-items: center; min-height: 44px; font: 500 16px/1.4 Inter, sans-serif; color: ' + t.ink + '; text-decoration: underline; text-underline-offset: 3px',
tabBar: 'position: fixed; z-index: 30; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; justify-content: space-between; gap: 4px; padding: 4px; border-radius: 999px; ' + glass,
tabNav: pillBase + 'flex: 1; padding: 0 8px; color: ' + t.ink,
footer: 'display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 16px; font: 400 13px/1.4 Inter, sans-serif; color: ' + t.muted,
footLink: 'display: inline-flex; align-items: center; min-height: 44px; color: ' + t.muted + '; text-decoration: underline; text-underline-offset: 3px'
};
}
}
</script>
