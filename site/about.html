footer: 'margin-top: ' + (mob ? '32px' : 'auto') + '; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 16px; font: 400 13px/1.4 Inter, sans-serif; color: ' + t.muted,
footLink: 'display: inline-flex; align-items: center; min-height: 44px; color: ' + t.muted + '; text-decoration: underline; text-underline-offset: 3px',
tabBar: 'position: fixed; z-index: 30; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; justify-content: space-between; gap: 4px; padding: 4px; border-radius: 999px; ' + glass,
tabNavActive: pillBase + 'flex: 1; padding: 0 8px; background: ' + t.ink + '; color: ' + t.bg,
tabNav: pillBase + 'flex: 1; padding: 0 8px; color: ' + t.ink
};
// Paper (Spike): Greige-Mappe, Blatt mit Schneidemarken, Oliv-Lime-Rosa-Verlauf, Büroklammer am Foto, Pergament-Etiketten
if (paper) {
const O = outline ? PAPER.outlineUi('light') : null;
const C = PAPER.c, F = PAPER.f, noBlur = '; backdrop-filter: none; -webkit-backdrop-filter: none';
const card = (bg, fg) => '; border-radius: 18px; color: ' + fg + '; background: ' + bg + '; box-shadow: none; filter: none';
const plab = '; padding: 7px 14px; border-radius: 999px; ' + PAPER.vellum + '; color: ' + C.ink + '; font: 500 13px/1.2 ' + F.text;
const mcard = (v) => mob ? v + '; border-radius: 18px; background: ' + C.paper + noBlur + '; box-shadow: ' + PAPER.shadow : v;
Object.assign(V, {
bgGrain: PAPER.grain,
// Seitenhintergrund: derselbe Horizont-Verlauf wie auf Work, über die ganze Scrollhöhe
rootStyle: V.rootStyle + '; background: ' + PAPER.horizon + ', ' + PAPER.rootBg,
// Logo hell, wenn der Verlauf oben im dunklen Oliv beginnt
logoInk: C.paper,
// Outline-Theme: filigrane Navigation mit heller Haarlinie auf dem Oliv, Tab-Leiste am Handy in Walnuss
navStyle: O ? O.nav : PAPER.nav,
pillActive: O ? O.pillActive : PAPER.pill + '; ' + PAPER.pillActive,
pill: O ? O.pill : PAPER.pill,
iconBtn: O ? O.iconBtn : PAPER.iconBtn,
paperIconInk: O ? O.iconInk : t.ink, paperIconW: O ? O.iconW : '1.8',
tabBar: O ? O.tabBar : PAPER.tabBar,
tabNavActive: O ? O.tabBtnActive : PAPER.tabBtn + '; ' + PAPER.tabBtnActive,
tabNav: O ? O.tabBtn : PAPER.tabBtn,
folderWrap: mob ? V.folderWrap : V.folderWrap + '; background: ' + C.sand + noBlur + '; box-shadow: ' + PAPER.lift,
bgLayer: V.bgLayer + '; opacity: 1',
mBg: V.mBg + '; opacity: 1',
// Outline-Theme: kein Reiter „Fiona Tran“ – die Abschnitts-Reiter rücken nach links an seine Stelle,
// die Hintergrund-Zeile ist genau so hoch wie die Reiter (46px), damit sie auf dem Blatt sitzen
bgTab: O ? 'display: none' : V.bgTab + '; background: ' + C.paper,
bgTabRow: O ? 'min-height: 46px' : V.bgTabRow,
folderTop: O ? V.folderTop + '; justify-content: flex-start; gap: 0' : V.folderTop,
folderTab: O ? 'display: none' : V.folderTab,
connector: O ? 'display: none' : V.connector,
mTabBg: V.mTabBg + '; background: ' + C.paper,
bgConn: O && !mob ? 'display: none' : V.bgConn.replace('rgba(255,255,255,0)', 'rgba(250,248,244,0)').replace('#FFFFFF', C.paper),
bgSheet: V.bgSheet + '; background: ' + C.paper,
tabTitle: 'font: 400 ' + (mob ? 30 : 34) + 'px/1.05 ' + F.display + '; letter-spacing: 0.02em; color: ' + C.olive, // Name auf dem Reiter in Oliv
// Outline-Theme: echte Ordner-Reiter wie „Fiona Tran“ – kleine Papierreiter mit runden oberen Ecken
// in Tenor Sans. Der aktive ist papierhell und geht nahtlos ins Blatt über, die anderen liegen etwas
// dunkler und leicht verschattet dahinter. Kein gleitender Indikator; rechts Abstand zur runden
// Blattecke, damit der Reiter „Contact“ nicht über der Rundung hängt.
tabInd: O ? V.tabInd + '; display: none' : V.tabInd + '; background: ' + C.wine,
tabsOnFrame: O ? V.tabsOnFrame + '; align-self: flex-end; gap: ' + R + 'px; padding: 0 ' + (R + 8) + 'px 0 0' : V.tabsOnFrame,
tabs: V.tabs.map((x, i) => ({ ...x, flare: O && x.sel === 'true' ? (i === 0 ? 'right' : 'both') : 'none', styleFrame: O
? x.styleFrame + '; width: auto; min-height: 46px; padding: 0 22px; border-radius: ' + R + 'px ' + R + 'px 0 0; font: 400 17px/1 ' + F.display + '; letter-spacing: 0.04em; transition: background 200ms ' + PAPER.ease + ', color 200ms ' + PAPER.ease + (x.sel === 'true'
? '; z-index: 2; background: ' + C.paper + '; color: ' + C.walnut + '; --flare: ' + C.paper + '; --fr: ' + R + 'px'
: '; background: #ECE7DF; color: ' + C.muted + '; box-shadow: inset 0 -8px 10px -8px rgba(60,40,45,0.14)')
: x.styleFrame + '; font: 500 15px/1 ' + F.text + '; color: ' + (x.sel === 'true' ? C.pink : C.ink) })),
helloH1: 'margin: 0; font: 400 ' + (mob ? 52 : 80) + 'px/1 ' + F.hero + '; letter-spacing: 0.01em; text-align: center; color: ' + C.wine,
helloSmall: 'margin: 0; font: 400 ' + (mob ? 52 : 80) + 'px/1 ' + F.hero + '; letter-spacing: 0.01em; color: ' + C.wine, // so groß wie „Hi, I'm Fiona!“
photoCard: V.photoCard + '; overflow: visible; border-radius: 20px',
photoImg: V.photoImg + '; border-radius: 20px',
photoClip: PAPER.clip(mob ? 'left: 50%; top: -18px; margin-left: -10px' : 'left: 36px; top: -22px', mob ? 58 : 72, -8),
lab1: V.lab1 + plab, lab2: V.lab2 + plab, lab3: V.lab3 + plab, lab4: V.lab4 + plab,
// Die Fläche der Identität: Oliv
wAbout: V.wAbout + card(C.olive, '#FFFFFF'),
wBigOn: 'position: relative; font: 400 ' + (mob ? 28 : 42) + 'px/1.05 ' + F.display + '; letter-spacing: 0.01em; color: #FFFFFF',
liW: V.liW + '; color: #FFFFFF',
wFocus: V.wFocus + card(C.lime, C.oliveInk),
wLabelW: 'position: relative; ' + PAPER.fine + '; font-size: 11px; color: inherit',
focusRowW: V.focusRowW + '; color: ' + C.oliveInk,
dot1: C.wine, dot2: C.olive, dot3: '#FFFFFF',
// Verlauf Oliv → Lime → Rosa, die Zahl in Weinrot darauf
wYears: V.wYears + card(PAPER.bloom, C.wine),
yearsFill: C.wine,
yearsCap: 'position: relative; align-self: center; text-align: center; font: 500 14px/1.3 ' + F.text + '; color: ' + C.wine,
wDev: V.wDev + card(C.lime, C.oliveInk), wCloud: V.wCloud + card('#D3DCE0', C.ink), wTest: V.wTest + card(C.pink, C.wine), wDesign: V.wDesign + card(C.olive, '#FFFFFF'),
chipW: 'cursor: default; user-select: none; -webkit-user-select: none; position: relative; display: inline-flex; align-items: center; min-height: 32px; padding: 0 14px; border-radius: 999px; background: ' + C.paper + '; color: ' + C.ink + '; font: 500 14px/1 ' + F.text + '; box-shadow: 0 1px 2px rgba(60,40,45,0.10)' + noBlur,
h2: 'margin: 0; font: 400 ' + (mob ? 36 : 44) + 'px/1.05 ' + F.display + '; letter-spacing: 0.01em; color: ' + C.wine,
wLabel: PAPER.fine + '; font-size: 11px; color: ' + C.muted,
cvRow: mob ? V.cvRow + '; border-bottom: 1px solid ' + C.line : V.cvRow + '; border: 0; border-radius: 14px; background: #F2EEE8; box-shadow: none',
cvYear: V.cvYear + '; color: ' + C.muted + '; font-variant-numeric: tabular-nums',
cvWhat: V.cvWhat + '; color: ' + C.ink,
bio: V.bio + '; color: ' + C.muted,
// Abstand über dem Button größer als zwischen den CV-Abschnitten (Kontakt setzt seinen eigenen margin-top)
ctaStyle: PAPER.button + '; margin-top: ' + (mob ? 32 : 44) + 'px',
social: 'display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; background: ' + C.paper + '; color: ' + C.ink + '; font: 500 15px/1 ' + F.text + '; border: 1px solid ' + C.line + '; box-shadow: none',
secTools: mcard(V.secTools), secCv: mcard(V.secCv), secContact: mcard(V.secContact)
});
}
// Desktop: die Seite schließt mit dem Fenster ab. Die Mappe füllt die Höhe zwischen Kopfzeile und
// Footer; ist ein Reiter länger, scrollt er in der Mappe statt der ganzen Seite. Bei niedrigen
// Fenstern (Laptop) werden Kopfzeile und Ränder schmaler. Unter 600 px Höhe scrollt die Seite normal.
if (!mob) {
const short = vh < 860, side = cmp ? 24 : 48;
Object.assign(V, {
rootStyle: V.rootStyle + '; height: max(100dvh, 600px)',
headerStyle: V.headerStyle + (short ? '; padding: 16px ' + side + 'px' : ''),
mainStyle: V.mainStyle + '; min-height: 0' + (short ? '; gap: 12px; padding: 4px ' + side + 'px 8px' : ''),
folderWrap: V.folderWrap + '; flex: 1 1 auto; min-height: 0',
bodyGrid: V.bodyGrid + '; flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr)',
fgLayer: V.fgLayer + '; min-height: 0',
sheet: V.sheet + '; flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; grid-auto-rows: minmax(100%, auto)' + (short ? '; padding: 20px' : ''),
photoCard: V.photoCard + '; min-height: ' + (short ? 280 : 360) + 'px',
// Kacheln nie kleiner als ihr Inhalt, damit kein Text abgeschnitten wird
widgetGrid: V.widgetGrid + '; grid-template-rows: minmax(min-content, 1.15fr) minmax(min-content, 1fr)'
});
// CV kompakter, solange das Fenster nicht sehr hoch ist (weniger Scrollen in der Mappe)
if (vh < 1000) Object.assign(V, {
cvRow: V.cvRow + '; padding-top: 10px; padding-bottom: 10px',
secCv: V.secCv + '; gap: 8px',
cvGap: 16,
ctaStyle: V.ctaStyle + '; margin-top: 28px'
});
// Niedrige Fenster: Profil etwas dichter, damit es ohne Scrollen in die Mappe passt
if (short) Object.assign(V, {
helloH1: V.helloH1 + '; font-size: ' + (vh < 720 ? 52 : 62) + 'px; line-height: 1.1',
helloSmall: V.helloSmall + '; font-size: ' + (vh < 720 ? 52 : 62) + 'px; line-height: 1.1',
aboutGrid: V.aboutGrid + '; gap: 16px',
widgetGrid: V.widgetGrid + '; gap: 12px',
wAbout: V.wAbout + '; gap: 12px; padding: 20px 22px',
wFocus: V.wFocus + '; gap: 10px; padding: 18px 20px',
wYears: V.wYears + '; gap: 8px; padding: 16px 20px',
wBigOn: V.wBigOn + '; font-size: ' + (vh < 720 ? 26 : 30) + 'px',
liW: V.liW + '; font-size: 15px; line-height: 1.45',
list: V.list + '; gap: 4px',
focusRowW: V.focusRowW + '; font-size: 15px',
yearsSvg: V.yearsSvg + '; height: ' + (vh < 720 ? 48 : 60) + 'px'
});
// Sehr niedrige Fenster (unter 720 px): Ränder der Mappe und die Überschrift noch etwas knapper
if (vh < 720) Object.assign(V, {
helloH1: V.helloH1 + '; font-size: 46px',
helloSmall: V.helloSmall + '; font-size: 46px',
folderWrap: V.folderWrap + '; padding: 8px',
folderTab: V.folderTab + '; padding-top: 12px; padding-bottom: 8px',
tabsOnFrame: V.tabsOnFrame + (outline ? '' : '; padding-bottom: 8px'), // Outline: Reiter sitzen direkt auf dem Blatt
sheet: V.sheet + '; padding: 14px 20px'
});
}
PAPER.mark(theme);
return V;
}
}
</script>
</body>
</html>
