// Titel des aktuellen Projekts: Anordnung wie in Hell und Dunkel (Pille, Jahr und Kategorie über
// dem Titel), im Paper-Look: Papier-Pille wie die Navigation, Titel in Pinyon Script
infoStyle: V.infoStyle + '; border: 0; background: ' + C.paper + '; box-shadow: ' + PAPER.shadow + '; backdrop-filter: none; -webkit-backdrop-filter: none',
metaStyle: 'font: 500 12px/1.4 ' + F.text + '; letter-spacing: 0.06em; color: ' + C.muted,
titleStyle: 'font: 400 ' + (mob ? 26 : 32) + 'px/1.2 ' + F.display + '; color: ' + C.wine + '; min-width: ' + (mob ? 150 : 220) + 'px',
detailInner: V.detailInner + '; background: ' + PAPER.crop(14, 14, 'rgba(108,20,59,0.35)') + ', ' + C.paper + '; border-radius: ' + (sheetMode ? '20px 20px 0 0' : '22px') + '; box-shadow: 0 30px 70px rgba(60,40,45,0.22)',
hero: V.hero + '; border-radius: 16px',
detailTitle: 'margin: 0; font: 400 ' + (mob ? 40 : 56) + 'px/1.02 ' + F.hero + '; letter-spacing: 0.01em; color: ' + C.wine,
detailText: V.detailText + '; color: ' + C.muted,
strong: 'font-weight: 600; color: ' + C.ink,
detailLabel: PAPER.fine + '; font-size: 11px; color: ' + C.muted,
factRow: V.factRow + '; border-bottom: 1px solid ' + C.line,
factVal: V.factVal + '; color: ' + C.ink,
linkRow: 'display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 0 20px; border-radius: 999px; font: 500 15px/1 ' + F.text + '; color: ' + C.pink + '; background: ' + C.wine,
shot1: V.shot1 + '; border-radius: 14px',
shot2: V.shot2 + '; border-radius: 14px',
nextCard: V.nextCard + '; border-top: 1px solid ' + C.line,
nextTitle: 'font: 400 ' + (mob ? 30 : 38) + 'px/1.1 ' + F.display + '; letter-spacing: 0.01em; color: ' + C.wine
});
}
PAPER.mark(theme);
return V;
}
}
</script>
